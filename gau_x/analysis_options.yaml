# Static analysis for GauX. CI runs `flutter analyze --fatal-infos`, so every
# lint below blocks a merge. Suppress a single line with
# `// ignore: rule_name` and a reason, never a whole file.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_return: error
    unused_import: error
    dead_code: warning
  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Correctness
    - always_declare_return_types
    - avoid_catches_without_on_clauses
    - cancel_subscriptions
    - close_sinks
    - discarded_futures
    - unawaited_futures
    - avoid_void_async
    - only_throw_errors
    - test_types_in_equals
    - unnecessary_await_in_return

    # Readability and consistency
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_final_fields
    - prefer_single_quotes
    - sort_child_properties_last
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_super_parameters
