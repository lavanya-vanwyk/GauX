name: gau_x
description: A companion
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

  
dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  google_fonts: ^6.1.0
  
  shared_preferences: ^2.5.6
  intl: ^0.19.0
  
  video_player: ^2.7.0
  
  # Logic
  http: ^1.2.0
  geolocator: ^10.1.0
  permission_handler: ^11.3.0
  
  # Map & Geometry
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  flutter_polyline_points: ^2.0.0

  path_provider: ^2.1.2
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_native_splash:
  color: "#031F55"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/splash_video.mp4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21