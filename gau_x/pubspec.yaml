name: gau_x
description: Last-mile ride booking and digital wallet for Gautrain commuters.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  video_player: ^2.7.0

  # State & navigation
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.1.2

  # Networking & device
  http: ^1.2.0
  geolocator: ^14.1.2

  # Map & geometry
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Models
  gaux_contracts:
    path: ../packages/gaux_contracts
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

  # Code generation (run `dart run build_runner build`)
  # build_runner is held below 2.17 until riverpod_generator supports build 5.
  build_runner: '>=2.16.2 <2.17.0'
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/splash_video.mp4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
