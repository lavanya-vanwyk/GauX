name: gau_x
description: Last-mile ride booking and digital wallet for Gautrain commuters.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.5.6
  video_player: ^2.7.0

  # Networking & device
  http: ^1.2.0
  permission_handler: ^11.3.0

  # Map & geometry
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

  # Code generation (run `dart run build_runner build -d`)
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/splash_video.mp4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
