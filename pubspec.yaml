name: gau_x
description: A Ride Sharing App for Gautrain Users
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

  
dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.1.0
  
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  
  # Logic
  http: ^1.2.0
  geolocator: ^10.1.0
  permission_handler: ^11.3.0
  
  # Map & Geometry
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  flutter_polyline_points: ^2.0.0
  
 
  
  path_provider: ^2.1.2
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

assets:
  - .env
  - assets/images/
