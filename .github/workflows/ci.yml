name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Backend and shared contracts (the pub workspace at the repo root)
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same SDK as the app, so contracts are tested against one Dart version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: dart pub get

      # Generated files are committed; fail if they're out of date
      - run: dart run build_runner build
        working-directory: packages/gaux_contracts
      - run: test -z "$(git status --porcelain -- packages/gaux_contracts/lib)"

      - run: dart format --output=none --set-exit-if-changed packages/gaux_contracts/lib packages/gaux_contracts/test backend/lib backend/routes backend/test
      - run: dart analyze --fatal-infos packages/gaux_contracts backend
      - run: dart test
        working-directory: packages/gaux_contracts
      - run: dart test
        working-directory: backend

      # Proves the deployable bundle (and its Dockerfile) can be produced
      - run: |
          dart pub global activate dart_frog_cli
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - run: dart_frog build
        working-directory: backend

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gau_x
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get

      # Generated files are committed; fail if they're out of date
      - run: dart run build_runner build
      - run: git status --porcelain -- lib && test -z "$(git status --porcelain -- lib)"

      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage

  build-android:
    needs: app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gau_x
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build apk --debug --dart-define-from-file=config/dev.json
